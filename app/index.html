/* ===== V5: negozio di app ===== */
.store{max-width:1240px;margin:0 auto;padding:24px 24px 120px}
.search{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--b);border-radius:999px;padding:6px 8px 6px 20px;box-shadow:0 6px 20px rgba(28,42,30,.06)}
.search input{flex:1;border:0;font:inherit;font-size:17px;padding:12px 0;background:transparent;color:var(--k);min-width:0}
.search input:focus{outline:none}
.search:focus-within{border-color:#267653;box-shadow:0 0 0 4px rgba(38,118,83,.18)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--b2);background:#fff;border-radius:999px;padding:10px 16px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;color:var(--k);min-height:44px}
.cat[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:#fff}
.aicon{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08),0 6px 14px rgba(28,42,30,.14);position:relative}
.aicon svg{width:34px;height:34px}
.aicon.lg{width:96px;height:96px;border-radius:26px}.aicon.lg svg{width:52px;height:52px}
.aicon.sm{width:48px;height:48px;border-radius:14px}.aicon.sm svg{width:26px;height:26px}
.aicon .dot{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:#FF6B5B;border:2px solid #fff}
.row-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:32px 0 12px}
.row-h h2{font-size:22px;letter-spacing:-.025em;font-weight:700}
.row-h .small{white-space:nowrap}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,170px);gap:14px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory}
.app{scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--k);background:transparent;border:0;padding:8px;border-radius:18px;font:inherit;text-align:left;cursor:pointer}
.app:hover{background:#fff}
.app strong{font-size:15px;line-height:1.25;letter-spacing:-.01em}
.app span.s{font-size:12.5px;color:var(--t3);line-height:1.35}
.price-t{display:inline-flex;align-self:flex-start;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#E6F4CF;color:#174D3A}
.price-t.pay{background:#174D3A;color:#fff}
.price-t.lock{background:#EDEDE6;color:#3B463D}
.grid-apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.featured{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
@media (max-width:860px){.featured{grid-template-columns:1fr}}
.feat{border-radius:26px;padding:28px;display:flex;flex-direction:column;gap:14px;text-decoration:none;color:inherit;position:relative;overflow:hidden;min-height:240px}
.feat-1{background:linear-gradient(135deg,#174D3A 0%,#2C4A2E 60%,#267653 100%);color:#fff}
.feat-2{background:#5E9E7E;color:#174D3A}
.feat h3{font-size:clamp(24px,3vw,34px);letter-spacing:-.035em;line-height:1.05}
.feat p{font-size:15px;line-height:1.5;opacity:.9;max-width:420px}
.feat .bg-ic{position:absolute;right:-20px;bottom:-30px;opacity:.12;width:220px;height:220px}
.resume{display:flex;gap:14px;align-items:center;background:#fff;border:2px solid #5E9E7E;border-radius:20px;padding:14px 16px;margin-top:18px}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(18,30,20,.45);z-index:95;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:760px){.sheet-bg{align-items:center}}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px 24px 28px;display:flex;flex-direction:column;gap:18px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@media (min-width:760px){.sheet{border-radius:28px}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:3px;background:#CFD4C6;align-self:center}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--b);border-bottom:1px solid var(--b);padding:12px 0}
.badges div{text-align:center;display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--t3)}
.badges div+div{border-left:1px solid var(--b)}
.badges strong{font-size:16px;color:var(--k)}
.shots{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:10px;overflow-x:auto}
.shot-m{height:250px;border-radius:16px;background:#fff;border:1px solid var(--b);padding:12px;display:flex;flex-direction:column;gap:8px;font-size:11px}
.shot-m i{display:block;height:8px;border-radius:4px;background:#E1E4DA}
.shot-m b{display:block;height:28px;border-radius:9px;background:#E8F1EB}
/* app chrome */
.appbar{position:sticky;top:0;z-index:30;background:rgba(246,247,242,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--b)}
.appbar .in{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.back{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--b);text-decoration:none;color:var(--k);font-size:22px;cursor:pointer;flex:none}
.appbody{max-width:900px;margin:0 auto;padding:20px 16px 120px}
/* wizard */
.wz-dots{display:flex;gap:6px}
.wz-dots span{flex:1;height:6px;border-radius:3px;background:#DDE2D3}
.wz-dots span.on{background:var(--forest)}
.wz-q{font-size:clamp(26px,4.4vw,36px);letter-spacing:-.035em;line-height:1.1;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile-b{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:136px;border-radius:22px;background:#fff;border:2px solid var(--b);font:inherit;font-size:16px;font-weight:700;color:var(--k);cursor:pointer;padding:14px;text-align:center;transition:transform .12s,border-color .15s}
.tile-b:active{transform:scale(.96)}
.tile-b[aria-pressed="true"]{border-color:#267653;background:#E8F1EB}
.tile-b .em{font-size:34px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chipb{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:999px;border:2px solid var(--b2);background:#fff;font:inherit;font-size:16px;font-weight:600;color:var(--k);cursor:pointer;transition:all .12s}
.chipb:active{transform:scale(.96)}
.chipb[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:#fff}
.chipb[aria-pressed="true"]::before{content:"\2713";color:var(--lime);font-weight:800}
.chipb.add{border-style:dashed;color:var(--g)}
.counter{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--b);border-radius:18px;padding:12px 14px}
.counter .ct{display:flex;align-items:center;gap:12px}
.counter button{width:48px;height:48px;border-radius:50%;border:1px solid var(--b2);background:#fff;font-size:24px;cursor:pointer;color:var(--k)}
.counter output{font-size:22px;font-weight:700;min-width:28px;text-align:center}
.carmap{display:grid;grid-template-columns:1fr 1.4fr 1fr;grid-template-rows:auto auto auto;gap:8px;max-width:420px;margin:0 auto}
.carmap button{font:inherit;font-weight:700;font-size:14px;border:2px solid var(--b2);background:#fff;color:var(--k);border-radius:16px;min-height:64px;cursor:pointer;padding:8px}
.carmap button[aria-pressed="true"]{background:#FFE7E3;border-color:#FF6B5B;color:#9A2A1D}
.carmap .body{grid-row:2;grid-column:2;border-radius:40px;min-height:170px;background:#E8F1EB}
.carmap .front{grid-row:1;grid-column:2}.carmap .rear{grid-row:3;grid-column:2}.carmap .lft{grid-row:2;grid-column:1}.carmap .rgt{grid-row:2;grid-column:3}
.sumcard{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--b);border-radius:16px;padding:14px 16px}
.sumcard span.l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3)}
.sumcard p{font-size:15px;line-height:1.5;margin-top:4px}
.edit{border:0;background:#E8F1EB;color:var(--forest);font:inherit;font-weight:700;font-size:13px;border-radius:999px;padding:8px 12px;cursor:pointer;min-height:36px;flex:none}
.wz-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(246,247,242,.96);backdrop-filter:blur(14px);border-top:1px solid var(--b)}
.wz-nav .in{max-width:900px;margin:0 auto;padding:12px 16px;display:flex;gap:10px}
.wz-nav .btn{flex:1;min-height:56px;font-size:17px}
.wz-nav .btn-o{flex:0 0 auto;min-width:56px}
.hint{display:flex;gap:10px;align-items:flex-start;background:#E8F1EB;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5;color:#174D3A}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.quick button{border:1px solid var(--b2);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;min-height:36px;color:var(--k)}
.quick button:hover{border-color:#267653}
body.has-wz .mcta,body.has-wz #cookie-root{display:none}
body.has-wz{padding-bottom:84px}
.app-w{position:relative;scroll-snap-align:start}
.app-w .app{width:100%}
.app-i{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:1px solid var(--b2);background:#fff;font:inherit;font-weight:700;font-size:14px;font-style:italic;color:var(--t3);cursor:pointer}
.app-i:hover{border-color:var(--forest);color:var(--forest)}
/* ===== V6: uniforme e minimale ===== */
.aicon.v6{background:linear-gradient(150deg,#FBFDF6 0%,#E6F2CF 100%);border:1px solid #D3E5B1;box-shadow:0 1px 0 #fff inset,0 6px 16px rgba(31,58,34,.12)}
.aicon.v6 svg{overflow:visible}
.aicon .eur{position:absolute;right:-5px;bottom:-5px;width:22px;height:22px;border-radius:50%;background:#174D3A;color:#5E9E7E;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #FAFBF9}
.aicon .eur.lk{background:#fff;font-size:10px;border-color:#E1E4DA}
.aicon.sm .eur{width:18px;height:18px;font-size:10px;right:-4px;bottom:-4px}
.price-t.pay{background:#174D3A;color:#5E9E7E}
.v6h{position:sticky;top:0}
.v6h .wrap{min-height:72px}
.menu6{display:inline-flex;align-items:center;gap:8px;border:0;background:#174D3A;color:#fff;border-radius:999px;padding:0 18px;min-height:46px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.menu6:hover{background:#2C4A2E}
.h6{background:radial-gradient(70% 80% at 85% 20%,#EAF5D6 0%,rgba(246,247,242,0) 70%)}
.h6-grid{display:flex;flex-wrap:wrap;align-items:center;gap:32px 56px;padding-top:40px;padding-bottom:40px}
.h6-grid>div:first-child{flex:1 1 440px;min-width:0}
.h6-art{flex:1 1 420px;min-width:0;max-width:580px;margin:0 auto}
.h6-photo{width:100%;aspect-ratio:5/4;object-fit:cover;border-radius:28px}
.h6-t{font-size:clamp(38px,5.8vw,68px);line-height:1.02;letter-spacing:-.045em}
.h6-cta{max-width:420px}
.h6-cta .btn{width:100%;justify-content:center}
.qtiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.qtiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.qtiles{grid-template-columns:1fr}}
.qt{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--b);border-radius:20px;padding:16px;text-decoration:none;color:var(--k);font:inherit;text-align:left;cursor:pointer;min-height:92px;transition:transform .12s,border-color .15s,box-shadow .15s}
.qt:hover{border-color:#B5D97A;box-shadow:0 10px 26px rgba(31,58,34,.08);color:var(--k)}
.qt:active{transform:scale(.98)}
.qt strong{font-size:16.5px;letter-spacing:-.015em}
.qt span span{font-size:13px;color:var(--t3)}
.qt-go{margin-left:auto;font-size:26px;color:#9AA592}
.trust6{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:22px;font-size:13.5px;color:var(--t3)}
.mn-bg{align-items:stretch;justify-content:flex-end}
.mn{max-width:520px;max-height:none;height:100%;border-radius:0;animation:slidein .25s cubic-bezier(.2,.8,.2,1)}
@media (max-width:760px){.mn-bg{align-items:flex-end}.mn{max-width:none;height:94vh;border-radius:26px 26px 0 0;animation:up .28s cubic-bezier(.2,.8,.2,1)}}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.mn-h{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin:18px 4px 6px;font-weight:700}
.mn-list{display:flex;flex-direction:column;background:#fff;border:1px solid var(--b);border-radius:18px;overflow:hidden}
.mn-row{display:flex;align-items:center;gap:6px;padding-right:10px;border-top:1px solid #EEF0E9}
.mn-row:first-child{border-top:0}
.mn-open{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:12px 8px 12px 14px;border:0;background:transparent;font:inherit;text-align:left;cursor:pointer;color:var(--k);min-height:68px}
.mn-open:hover{background:#F7FAF1}
.mn-open strong{font-size:15.5px;letter-spacing:-.01em}
.mn-open span span{font-size:13px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mn-row .app-i{position:static;flex:none}
.tile-b .aicon{margin-bottom:2px}
.skip6:focus{position:fixed!important;width:auto!important;height:auto!important;clip:auto!important;left:12px;top:12px;z-index:200;background:#174D3A;color:#fff;padding:12px 16px;border-radius:10px;border:0}@media (max-width:560px){.wm small{display:none}.wm span.w{font-size:22px}.menu6{padding:0 14px}.v6h .wrap{gap:8px}.hd-actions{gap:2px}}
.gsbar{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:1px solid var(--b);border-radius:999px;padding:14px 20px;font:inherit;font-size:15px;color:var(--t3);cursor:text;text-align:left;box-shadow:0 6px 20px rgba(28,42,30,.06);min-height:52px}
.gsbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsbar:hover{border-color:#B5D97A}
.gsbar.big{padding:16px 22px;font-size:16px;min-height:58px}
.gs-ty{font-size:11px!important;letter-spacing:.1em;text-transform:uppercase;color:#4F7A3A!important;font-weight:700}
.gs-row{border-top:1px solid #EEF0E9}.gs-row:first-child{border-top:0}
.gs-ans{padding:0 16px 16px 76px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.gs-ans p{font-size:15px;line-height:1.6;color:var(--t2)}
mark{background:#E4F5C2;color:inherit;border-radius:3px;padding:0 1px}
@media (max-width:560px){.gs-ans{padding-left:16px}}
.search{min-width:0}.search input{min-width:0;width:100%}

/* v8 responsive */
html{-webkit-text-size-adjust:100%}
img,svg,canvas,video{max-width:100%}
.qr canvas,.qr img{max-width:100%;height:auto}
.logo svg{flex-shrink:0}
.qr{max-width:100%;overflow:hidden}.qr>*{max-width:100%!important;height:auto!important}
html,body{overflow-x:clip}
.c2{grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.c4{grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr))}
header.site .wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
@media (max-width:480px){
 .wrap{padding-left:18px;padding-right:18px}
 .menu6{width:46px;padding:0;justify-content:center;gap:0;font-size:0}
 .menu6 svg{width:22px;height:22px}
 .hd-actions{gap:0}
 header.site .wrap{gap:8px}
}
@media (max-width:360px){
 .wrap{padding-left:14px;padding-right:14px}
 .logo svg{width:24px;height:27px}
 .logo .w{font-size:19px}
 .logo{gap:8px}
 .card{padding:20px}
}
@media (min-width:1600px){.wrap{max-width:1320px}}

/* v10: palette istituzionale */
@font-face{font-family:Inter;src:url(/assets/fonts/inter.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:Manrope;src:url(/assets/fonts/manrope.woff2) format("woff2");font-weight:200 800;font-display:swap}
:root{--g:#267653;--gd:#174D3A;--gl:#E8F1EB;--gm:#CFE3D6;--mint:#E8F1EB;--mint2:#F1F4F1;--k:#202923;--k2:#174D3A;--k3:#1F5A44;--t2:#202923;--t3:#66736B;--t4:#66736B;--b:#E1E7E2;--b2:#D3DCD5;--bg2:#F1F4F1;--paper:#FAFBF9;--forest:#174D3A;--lime:#E8F1EB;--gold:#C5A66A}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#FAFBF9}
h1,h2,h3,.h1,.h2,.wm{font-family:Manrope,Inter,system-ui,sans-serif}
.btn-g,.btn-l{background:#174D3A!important;color:#fff!important}
.btn-g:hover,.btn-l:hover{background:#123d2e!important}
.cta-lime{background:#174D3A!important;color:#fff!important}.cta-lime h2,.cta-lime p{color:#fff!important}
.cta-lime .btn-g,.cta-lime .btn-l,.cta-lime .btn{background:#fff!important;color:#174D3A!important}

.eyebrow::before{background:#C5A66A!important}
.wm span.w i{color:#C5A66A!important}

/* v11: Graphite & Champagne */
:root{--g:#28634F;--gd:#30363D;--gl:#F2F4F5;--gm:#E3E6E9;--mint:#F2F4F5;--mint2:#F7F8F9;--k:#30363D;--k2:#30363D;--k3:#454C54;--t2:#30363D;--t3:#5C646D;--t4:#5C646D;--b:#E3E6E9;--b2:#D5D9DD;--bg2:#F2F4F5;--paper:#FFFFFF;--forest:#30363D;--lime:#F2F4F5;--gold:#C7AD7C}
body{background:#fff}
.btn-g,.btn-l{background:#28634F!important;color:#fff!important}

:root{--g:#1F5EFF;--gd:#0B1B3A;--gl:#EEF3FF;--gm:#DCE6FF;--mint:#EEF3FF;--mint2:#F7F8FB;--k:#0B1B3A;--k2:#0B1B3A;--k3:#1F5EFF;--t2:#0B1B3A;--t3:#4A5672;--t4:#4A5672;--b:#E3E7F0;--b2:#D3DAE8;--bg2:#EEF1F7;--paper:#F7F8FB;--forest:#0B1B3A;--lime:#EEF3FF;--gold:#FF7A1A}
body{background:#F7F8FB;color:#0B1B3A}
h1,h2,.h1,.h2,.ht{color:#1F5EFF}
.btn-g,.btn-l{background:#FF7A1A!important;color:#0B1B3A!important;border-radius:14px!important}
.btn-g:hover,.btn-l:hover{background:#E8650A!important}
.cta-lime{background:linear-gradient(135deg,#1F5EFF,#3D74FF)!important}
.eyebrow::before{background:#FF7A1A!important}
.wm span.w i{color:#FF7A1A!important}
.card{border-radius:22px}

function prescr(kind, date){
  var d = RDEF[kind]; if (!date) return null;

}

/* ---------- effetti: reveal, scrollytelling, contatori, QR ---------- */
var obs = null, obs2 = null;
function setupFX(r){
  if (obs) obs.disconnect(); if (obs2) obs2.disconnect();
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if ('IntersectionObserver' in window && !reduce) {
    document.documentElement.classList.add('js-anim');
    obs = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); } }); }, {rootMargin:'0px 0px -8% 0px', threshold:0.05});
    document.querySelectorAll('.rv').forEach(function(el){ obs.observe(el); });
    var steps = document.querySelectorAll('.scrolly .step');
    if (steps.length) {
      obs2 = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting) {
        var k = Number(e.target.getAttribute('data-step'));
        steps.forEach(function(s){ s.classList.toggle('on', s === e.target); });
        var sc = document.querySelectorAll('#scr-stack > .screen'); sc.forEach(function(x, j){ x.classList.toggle('on', j === k); });
      } }); }, {rootMargin:'-45% 0px -45% 0px'});
      steps.forEach(function(s){ obs2.observe(s); });
    }
  } else {
    document.documentElement.classList.remove('js-anim');
  }
  if (r === 'partner' || r === 'professionisti') drawQR();
}
var qrLoading = false;
function drawQR(){
  var box = document.getElementById('qr'); if (!box) return;
  var url = 'https://www.stimaveloce.it/#analizza';
  var draw = function(){ box.innerHTML = ''; try { new window.QRCode(box, {text:url, width:168, height:168, colorDark:'#1D1D1F', colorLight:'#ffffff'}); } catch(e){ box.textContent = url; } };
  if (window.QRCode) return draw();
  if (qrLoading) return; qrLoading = true;
  var sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  sc.onload = function(){ qrLoading = false; draw(); }; sc.onerror = function(){ qrLoading = false; box.textContent = url; };
  document.head.appendChild(sc);
}

function num(n,l){ return '<label class="f">'+l+'<input class="input" type="number" min="0" step="any" inputmode="decimal" name="'+n+'"></label>'; }
function calcOut(){
  var f = $('#calc-form'), v = function(n){ var el = f && f.elements[n]; return el && el.value !== '' ? Number(el.value) : null; };
  var t = C.tab;
  if (t==='franchigia'){ var d=v('danno'), fr=v('franchigia'); if (d==null||fr==null) return hint(); var ind=Math.max(0,d-fr); return outBox('Indennizzo stimato', eur(ind), 'A tuo carico: '+eur(Math.min(d,fr))); }
  if (t==='scoperto'){ var d2=v('danno'), p=v('perc'), mn=v('minimo')||0, mx=v('massimale'); if (d2==null||p==null) return hint(); var tr=Math.max(d2*p/100,mn); var ind2=Math.max(0,d2-tr); if (mx) ind2=Math.min(ind2,mx); return outBox('Indennizzo stimato', eur(ind2), 'Scoperto trattenuto: '+eur(Math.min(d2,tr))+(mx?' · entro il massimale':'')); }
  if (t==='vetusta'){ var nu=v('nuovo'), an=v('anni'), aa=v('annuo'), mx2=v('max'); if (nu==null||an==null||aa==null) return hint(); var dep=an*aa; if (mx2!=null) dep=Math.min(dep,mx2); dep=Math.min(dep,100); return outBox('Valore allo stato d’uso', eur(nu*(1-dep/100)), 'Deprezzamento applicato: '+dep.toLocaleString('it-IT')+'%'); }
  if (t==='biologico'){ return '<span style="color:#A3A3A3;font-size:14px;font-weight:600">Danno biologico</span><span style="font-size:17px;line-height:1.5">Il valore dipende dalle tabelle di legge aggiornate ogni anno e dalla valutazione medico-legale. Inserisci i dati e inviali: il perito ti risponde con una stima basata sulle tabelle in vigore.</span>'; }
}

function sbPull(){

  return SB.from('pratiche').select('id,dati,created_at').order('created_at', {ascending:false}).then(function(r){
    if (r.error) { console.warn(r.error); return; }
    var remote = {}, nuove = [];
    r.data.forEach(function(row){ if (row.dati && row.dati.id) { remote[row.id] = row.dati; sbHash[row.id] = JSON.stringify(row.dati); } });
    S.pratiche = S.pratiche.map(function(p){ if (remote[p.id]) { var d = remote[p.id]; delete remote[p.id]; return d; } return p; });
    r.data.forEach(function(row){ if (remote[row.id]) nuove.push(remote[row.id]); });
    S.pratiche = nuove.concat(S.pratiche);
    var fromServer = {}; r.data.forEach(function(row){ fromServer[row.id] = 1; });
    S.pratiche = S.pratiche.filter(function(x){ return !x.esempio; });
    S.pratiche.forEach(function(p){ if (!p.voci) p.voci = []; if (!p.rilievi) p.rilievi = {}; if (p.note == null) p.note = ''; if (!p.messaggi) p.messaggi = []; if (!p.notifiche) p.notifiche = []; if (!p.pagamenti) p.pagamenti = []; if (fromServer[p.id]) sbHash[p.id] = JSON.stringify(p); });
    try { localStorage.setItem('sv_demo_v1', JSON.stringify(S)); } catch(e){}
  });
}
function sbQueue(){ if (!sbUser || !SB) return; clearTimeout(sbTimer); sbTimer = setTimeout(sbPush, 600); }
function sbPush(){
  var me = sbUser; if (!me) return Promise.resolve();
  var rows = S.pratiche.filter(function(p){
    if (p.esempio || !p.id) return false;
    if (me.role === 'cliente' && (p.email||'').toLowerCase() !== me.email) return false;
    return sbHash[p.id] !== JSON.stringify(p);
  }).map(function(p){ var r = {id:p.id, email:(p.email||'').toLowerCase(), stato:p.stato || null, dati:JSON.parse(JSON.stringify(p))}; if (me.role === 'cliente') r.owner = me.id; return r; });
  if (!rows.length) return Promise.resolve();
  return SB.from('pratiche').upsert(rows, {onConflict:'id'}).then(function(r){
    if (r.error) { console.warn(r.error); if (!sbWarned) { sbWarned = true; toast('Salvataggio online non riuscito: i dati restano su questo dispositivo'); } return; }
    sbWarned = false; rows.forEach(function(x){ sbHash[x.id] = JSON.stringify(x.dati); });
  });
}
function sbEnter(user, wantRole){
  return sbRole(user).then(function(role){
    if (wantRole && role === 'cliente') { return SB.auth.signOut().then(function(){ throw new Error('__staff'); }); }
    if (wantRole === 'studio' && role !== 'studio') { return SB.auth.signOut().then(function(){ throw new Error('__staff'); }); }
    sbUser = {id:user.id, email:(user.email||'').toLowerCase(), role:role};
    S.session = {role:role, email:sbUser.email, sb:true};
    logEvt(sbUser.email, role === 'cliente' ? 'Accesso area cliente' : (role === 'perito' ? 'Accesso Scrivania del Perito' : 'Accesso area amministratore'));
    return sbPull().then(function(){ return sbPush(); }).then(function(){ save(); });
  });
}

function sbStart(){
  if (!SB) return;
  SB.auth.onAuthStateChange(function(ev, sess){
    if (ev === 'PASSWORD_RECOVERY' && sess) { AU.reset = {step:3, email:sess.user.email}; AU.err = ''; AU.tab = 'accedi'; if (location.hash !== '#area') location.hash = 'area'; else render(false); }
  });
  SB.auth.getSession().then(function(r){
    var sess = r.data && r.data.session;
    if (/[?&]code=/.test(location.search)) history.replaceState(null, '', location.pathname + location.hash);
    if (sess && sess.user && (!S.session || S.session.sb || (S.session.email||'').toLowerCase() === (sess.user.email||'').toLowerCase())) {
      if (AU.reset && AU.reset.step === 3) return;
      sbEnter(sess.user).then(function(){ render(true); }, function(){});
    } else if (!sess && S.session && S.session.sb) { S.session = null; save(); render(true); }
  });
}

function gsSearch(q){
  var nq = norm(q); if (!nq) return [];
  var toks = nq.split(' ').filter(function(t){ return t.length > 1 || /\d/.test(t); });
  if (!toks.length) return [];

    var T = norm(e.t), K = norm(e.kw), B = norm(e.s + ' ' + e.body), words = (T + ' ' + K).split(' '), score = 0, hits = 0;
    toks.forEach(function(tok){
      var alts = [tok].concat(SYN[tok] ? SYN[tok].split(' ') : []), best = 0;
      alts.forEach(function(w, ai){
        var f = ai === 0 ? 1 : 0.6, sc = 0;
        if (T.indexOf(w) === 0 || T.indexOf(' ' + w) > -1) sc = 6; else if (T.indexOf(w) > -1) sc = 4;
        else if (K.indexOf(w) > -1) sc = 3; else if (B.indexOf(w) > -1) sc = 1.5;
        else if (w.length >= 4 && words.some(function(x){ return x.length >= 3 && (lev1(w, x) || lev1(w, x.slice(0, w.length))); })) sc = 2;
        best = Math.max(best, sc * f);
      });
      if (best > 0) hits++; score += best;
    });
    if (hits < toks.length) score *= hits / toks.length * 0.5;
    if (e.ty === 'App') score *= 1.15;
    return {e:e, sc:score};
  }).filter(function(r){ return r.sc >= 1.2; }).sort(function(a, b){ return b.sc - a.sc; }).slice(0, 24).map(function(r){ return r.e; });
}

    RV = {stelle:0, testo:''}; save(); toast('Grazie! La pubblichiamo dopo la verifica'); render(true); return;
  }
  if (kind === 'msg') { var t = f.elements.t.value.trim(); if (!t) return; var p = curP(); p.messaggi.push({da:'cliente', t:t, at:oggi()}); save(); render(true); }
  if (kind === 'b-msg') { var t2 = f.elements.t.value.trim(); if (!t2) return; var p2 = S.pratiche[Number(f.getAttribute('data-j'))]; p2.messaggi.push({da:'studio', t:t2, at:oggi()}); p2.notifiche.push({t:'Nuovo messaggio dallo Studio', at:oggi()}); save(); toast('Messaggio inviato al cliente'); render(true); }
  if (kind === 'b-save') {
    var p3 = S.pratiche[Number(f.getAttribute('data-j'))]; var prev = p3.stato;
    p3.offerta = Number(f.elements.offerta.value) || 0; p3.stima = Number(f.elements.stima.value) || 0; p3.stato = f.elements.stato.value;
    if (p3.stato === 'completata' && prev !== 'completata') {
      var i = indice(p3);
      p3.notifiche.push({t:'Perizia pronta'+(i!=null?': Indice di Congruità '+i+'/100':''), at:oggi()});
      if (i != null && i < 80) p3.messaggi.push({da:'studio', t:'La perizia è pronta. L’offerta copre il '+i+'% del danno stimato: nel fascicolo trova la lettera di contestazione. Se preferisce, possiamo seguire noi la trattativa con la Garanzia Costo Zero.', at:oggi()});
    } else if (prev !== p3.stato) p3.notifiche.push({t:'Pratica: '+STATI[p3.stato], at:oggi()});
    save(); toast('Pratica aggiornata e cliente notificato'); render(true);
  }
  if (kind === 'prezzi') { ['stima','perizia','video','feeMin','feeMax','feeB2B'].forEach(function(k){ var v = Number(f.elements[k].value); if (!isNaN(v) && v >= 0) S.prezzi[k] = v; }); save(); toast('Prezzi aggiornati su tutto il sito'); render(true); }
  if (kind === 'partner-join') {
    var fe = f.elements, err = $('#pj-err');
    if (!fe.nome.value.trim() || !/^\S+@\S+\.\S+$/.test(fe.email.value.trim())) { err.textContent = 'Inserisci ragione sociale ed email validi.'; err.style.color = '#B91C1C'; return; }
    if (!fe.ok.checked) { err.textContent = 'Accetta le condizioni per i partner.'; err.style.color = '#B91C1C'; return; }
    S.partnerReq.unshift({nome:fe.nome.value.trim(), cat:fe.cat.value, citta:fe.citta.value.trim(), email:fe.email.value.trim()}); save(); toast('Candidatura inviata: la trovi nel backoffice'); render(true);
  }
});

/* ---------- v9: invio reale delle richieste allo Studio (Netlify Forms) ---------- */
function nfOn(){ return /^https?:$/.test(location.protocol) && !/claude|localhost|127\.0\.0\.1/.test(location.hostname); }
function nfShrink(file){
  return new Promise(function(res){
    if (!file || !/^image\//.test(file.type) || !window.createImageBitmap) return res(file && file.size < 3e6 ? file : null);
    createImageBitmap(file).then(function(bm){
      var k = Math.min(1, 1600 / Math.max(bm.width, bm.height)), c = document.createElement('canvas');
      c.width = Math.round(bm.width*k); c.height = Math.round(bm.height*k);
      c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);
      c.toBlob(function(b){ res(b ? new File([b], (file.name||'foto').replace(/\.[^.]+$/,'')+'.jpg', {type:'image/jpeg'}) : null); }, 'image/jpeg', 0.78);
    }).catch(function(){ res(file.size < 3e6 ? file : null); });
  });
}
function nfSend(form, data, files){
  if (!nfOn()) return Promise.resolve(false);
  var fd = new FormData(); fd.append('form-name', form);
  Object.keys(data).forEach(function(k){ var v = data[k]; fd.append(k, v == null ? '' : String(v)); });
  var list = (files || []).slice(0, 4);
  return Promise.all(list.map(nfShrink)).then(function(fs){
    var tot = 0;
    fs.forEach(function(f, i){ if (f && tot + f.size < 7.5e6) { tot += f.size; fd.append('foto'+(i+1), f, f.name); } });
    return fetch('/', {method:'POST', body:fd});
  }).then(function(r){ if (!r.ok) throw new Error(r.status); return true; })
    .catch(function(){ toast('Invio allo Studio non riuscito. Riprova o scrivi a '+STUDIO.email); return false; });
}
function nfLead(l){
  if (!l) return;
  var fs = PREV.map(function(x){ return x.file; }).filter(Boolean);
  nfSend('richiesta', {pratica:l.id||'', ambito:l.amb||'', tipo:l.tipo||'', data_sinistro:l.data||'', comune:l.comune||'', descrizione:l.descr||'', coinvolti:l.coinvolti||'', danni:l.danni||'', bene:l.bene||'', polizza:l.polizza||l.compagnia||'', esito:l.esito||'', offerta:l.offerta||'', nome:l.nome||'', email:l.email||'', telefono:l.tel||'', ricontatto:(l.via||'')+(l.fascia?' ('+l.fascia+')':''), file_allegati:(l.files||[]).join(', ')}, fs);
}
function toSite(){ var h=location.hash; if (h===''||h==='#'||h==='#home') { location.replace('/'); return true; } return false; }
window.addEventListener('hashchange', toSite);
if (!toSite()) render(false);
if (!S.cookie) showCookie();
sbStart();
payCheck();
rientroPagamento();
